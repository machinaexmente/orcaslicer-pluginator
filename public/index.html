<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pluginator</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="26" height="26">
      <div>
        <div class="brand-name">Pluginator</div>
        <div class="brand-sub">OrcaSlicer plugin browser</div>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.18 10.43l4.45 4.44-1.42 1.42-4.44-4.45A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>
      <input id="search" type="search" placeholder="Search plugins, authors, features…" autocomplete="off">
    </div>
    <div class="top-actions">
      <button id="refresh" class="icon-btn" title="Refresh catalogue" aria-label="Refresh catalogue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="m13.6 2 .5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.6 2.8-2 1.7c.1.6.1 1.2 0 1.8l2 1.7-1.6 2.8-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.2l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9L4.1 13l2-1.7a5 5 0 0 1 0-1.8l-2-1.7 1.6-2.8 2.5.9c.5-.4 1.1-.7 1.7-.9l.5-2.6h3.2ZM12 8.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z" transform="translate(0 1)"/></svg>
      </button>
    </div>
  </header>

  <div id="statusbar" class="statusbar" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="browse" role="tab">Browse <span id="count-all" class="count"></span></button>
        <button class="tab" data-view="installed" role="tab">Installed <span id="count-installed" class="count"></span></button>
      </nav>

      <div class="filter-block" data-browse-only>
        <div class="filter-title">Sort</div>
        <select id="sort">
          <option value="stars">Most stars</option>
          <option value="updated">Recently updated</option>
          <option value="name">Name</option>
        </select>
      </div>

      <div class="filter-block" data-browse-only>
        <div class="filter-title">Show</div>
        <label class="check"><input type="checkbox" id="only-installable" checked> One-click installable</label>
        <label class="check"><input type="checkbox" id="hide-archived" checked> Hide deprecated / archived</label>
      </div>

      <div class="filter-block" data-browse-only>
        <div class="filter-title">Categories <button id="clear-cats" class="link-btn" hidden>clear</button></div>
        <div id="categories" class="cat-list"></div>
      </div>

      <div class="sidebar-foot">
        Catalogue: <a id="registry-link" href="https://github.com/triluch/orcabits" target="_blank" rel="noopener">OrcaBits</a>
        <span id="catalog-date"></span>
      </div>
    </aside>

    <main class="main">
      <section id="view-browse">
        <div id="result-line" class="result-line"></div>
        <div id="grid" class="grid" aria-live="polite"></div>
      </section>
      <section id="view-installed" hidden>
        <div class="installed-head">
          <div>
            <h2>Installed in OrcaSlicer</h2>
            <p class="muted" id="installed-path"></p>
          </div>
          <button class="btn" id="open-plugins-folder">Open plugins folder</button>
        </div>
        <div id="installed-list" class="installed-list"></div>
      </section>
    </main>
  </div>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" tabindex="-1"></aside>

  <dialog id="settings" class="dialog">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="field">
        <span>OrcaSlicer data folder</span>
        <input id="data-dir" type="text" spellcheck="false">
        <small class="muted">Plugins are installed into <code>&lt;data folder&gt;/orca_plugins</code>. Leave empty for the default: <code id="default-dir"></code></small>
      </label>
      <div id="detected-dirs" class="detected" hidden></div>
      <div id="data-dir-check" class="muted"></div>
      <p class="muted small">GitHub token: <span id="token-state"></span>. Set <code>GITHUB_TOKEN</code> before starting Pluginator to raise GitHub's anonymous rate limit (optional).</p>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" id="save-settings" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
